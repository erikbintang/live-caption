<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caption Langsung</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f6;--panel:#fff;--ink:#14213d;--mute:#5b6678;--line:#d5dce6;--acc:#0e7c86;--accbg:#e1f3f4;--size:28px}
@media (prefers-color-scheme:dark){:root{--bg:#101826;--panel:#17233a;--ink:#eaf0f8;--mute:#9aa7bb;--line:#2a3a56;--acc:#5fd0d8;--accbg:#173a47}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,sans-serif}
header{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:end;padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
label{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--mute)}
select,button,input{font:inherit;color:var(--ink)}
select{padding:7px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
button{padding:9px 16px;border:1px solid var(--line);border-radius:6px;background:var(--bg);cursor:pointer}
button.go{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
@media (prefers-color-scheme:dark){button.go{color:#08222a}}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.sp{flex:1}
#status{padding:8px 16px;font-size:14px;color:var(--mute);border-bottom:1px solid var(--line);min-height:36px}
#feed{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:18px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.row p{margin:0;font-size:var(--size);line-height:1.4;max-width:60ch}
.row .t{color:var(--acc)}
body.solo .row{grid-template-columns:1fr}
body.solo .row .t{display:none}
#empty{margin:auto;max-width:44ch;text-align:center;color:var(--mute);line-height:1.5}
@media (max-width:700px){body:not(.pip) .row{grid-template-columns:1fr;gap:6px}}
body.pip #feed{container-type:inline-size;padding:10px 14px;gap:8px}
@container (max-width:639px){
  body.pip .row:not(:last-child){display:none}
  body.pip .row{grid-template-columns:1fr;border:0;padding:0}
  body.pip .row .t{display:none}
}
@container (min-width:640px){body.pip:not(.solo) .row{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:no-preference){.row{animation:in .25s ease-out}@keyframes in{from{opacity:.3}to{opacity:1}}}
</style>
</head>
<body class="solo">
<header>
  <label>Bahasa lawan bicara
    <select id="src"></select></label>
  <label>Terjemahkan ke
    <select id="tgt"></select></label>
  <label>Model
    <select id="model">
      <option value="onnx-community/whisper-tiny">Tiny (cepat, kurang akurat)</option>
      <option value="onnx-community/whisper-base" selected>Base (seimbang)</option>
    </select></label>
  <label>Ukuran teks
    <input id="size" type="range" min="16" max="56" value="28"></label>
  <span class="sp"></span>
  <button id="pip" type="button">Jendela mengambang</button>
  <button id="save" type="button">Simpan transkrip</button>
  <button id="go" class="go" type="button">Mulai</button>
</header>
<div id="status">Siap. Tekan Mulai, lalu pilih tab atau layar meeting dan centang “Bagikan audio”.</div>
<main id="feed" aria-live="polite">
  <p id="empty">Teks dari audio meeting akan muncul di sini. Model dijalankan di browsermu, tidak ada audio yang dikirim ke server.</p>
</main>

<script type="module">
const $ = s => document.querySelector(s);
const feedEl = $('#feed');
const LANG = {en:['english','Inggris'],id:['indonesian','Indonesia'],ja:['japanese','Jepang'],ko:['korean','Korea'],zh:['chinese','Mandarin'],es:['spanish','Spanyol'],fr:['french','Prancis'],de:['german','Jerman'],ar:['arabic','Arab']};
$('#src').innerHTML = '<option value="auto">Otomatis</option>' + Object.entries(LANG).map(([k,v]) => `<option value="${k}">${v[1]}</option>`).join('');
$('#tgt').innerHTML = '<option value="none">Tanpa terjemahan</option>' + Object.entries(LANG).map(([k,v]) => `<option value="${k}">${v[1]}</option>`).join('');
$('#src').value = 'en'; $('#tgt').value = 'id';
const setStatus = t => $('#status').textContent = t;

// Worker: Whisper jalan di browser lewat transformers.js
const workerSrc = `
import { pipeline } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.0';
let asr;
self.onmessage = async ({data:m}) => {
  try {
    if (m.type === 'load') {
      const device = self.navigator.gpu ? 'webgpu' : 'wasm';
      asr = await pipeline('automatic-speech-recognition', m.model, { device, progress_callback: p => self.postMessage({type:'progress', p}) });
      self.postMessage({type:'ready', device});
    } else if (m.type === 'run') {
      const o = { task: 'transcribe' };
      if (m.lang) o.language = m.lang;
      const out = await asr(m.audio, o);
      self.postMessage({type:'result', text: out.text});
    }
  } catch (e) { self.postMessage({type:'error', msg: String(e && e.message || e)}); }
};`;
const worker = new Worker(URL.createObjectURL(new Blob([workerSrc], {type:'text/javascript'})), {type:'module'});

let stream, ctx, proc, running = false, busy = false, queue = [], buf = [], speech = false, silent = 0;
let loadedModel = null, onReady = null;
const log = [];
const THR = 0.008, FRAME = 4096;

worker.onmessage = ({data:m}) => {
  if (m.type === 'progress' && m.p.status === 'progress') setStatus(`Mengunduh model… ${Math.round(m.p.progress||0)}% (hanya sekali, lalu tersimpan di browser)`);
  else if (m.type === 'ready') { setStatus(`Model siap (${m.device === 'webgpu' ? 'GPU' : 'CPU'}). Mendengarkan…`); onReady && onReady(); }
  else if (m.type === 'result') { busy = false; handle(m.text); pump(); }
  else if (m.type === 'error') { busy = false; setStatus('Error: ' + m.msg); }
};

function loadModel(model) {
  if (loadedModel === model) return Promise.resolve();
  return new Promise(res => { onReady = () => { loadedModel = model; res(); }; worker.postMessage({type:'load', model}); });
}

async function start() {
  try { stream = await navigator.mediaDevices.getDisplayMedia({video:true, audio:true}); }
  catch { return setStatus('Dibatalkan. Tekan Mulai untuk mencoba lagi.'); }
  if (!stream.getAudioTracks().length) {
    stream.getTracks().forEach(t => t.stop());
    return setStatus('Audio tidak ikut terbagi. Ulangi, pilih tab Chrome (atau layar penuh di Windows) dan centang “Bagikan audio”.');
  }
  stream.getVideoTracks()[0].addEventListener('ended', stop);
  $('#go').textContent = 'Berhenti'; running = true;
  setStatus('Memuat model…');
  await loadModel($('#model').value);
  if (!running) return;
  ctx = new AudioContext({sampleRate:16000});
  const node = ctx.createMediaStreamSource(new MediaStream(stream.getAudioTracks()));
  proc = ctx.createScriptProcessor(FRAME, 1, 1);
  proc.onaudioprocess = e => {
    const d = e.inputBuffer.getChannelData(0);
    let s = 0; for (let i = 0; i < d.length; i++) s += d[i]*d[i];
    const loud = Math.sqrt(s/d.length) > THR;
    buf.push(new Float32Array(d));
    if (loud) { speech = true; silent = 0; } else silent++;
    if (!speech) { if (buf.length > 3) buf.shift(); return; }
    if (silent >= 3 || buf.length >= 47) flush();
  };
  node.connect(proc); proc.connect(ctx.destination);
}

function stop() {
  running = false; queue = []; buf = []; speech = false;
  proc && proc.disconnect(); ctx && ctx.close();
  stream && stream.getTracks().forEach(t => t.stop());
  $('#go').textContent = 'Mulai'; setStatus('Berhenti.');
}

function flush() {
  const n = buf.reduce((a, b) => a + b.length, 0), a = new Float32Array(n);
  let o = 0; for (const b of buf) { a.set(b, o); o += b.length; }
  buf = []; speech = false; silent = 0;
  if (n < 16000) return;
  queue.push(a); if (queue.length > 3) queue.shift();
  pump();
}

function pump() {
  if (busy || !queue.length) return;
  busy = true;
  const l = $('#src').value;
  worker.postMessage({type:'run', audio: queue.shift(), lang: l === 'auto' ? null : LANG[l][0]});
}

function handle(text) {
  text = (text || '').trim();
  if (!text || /^[\[(].*[\])]$/.test(text)) return;
  feedEl.querySelector('#empty')?.remove();
  const tgt = $('#tgt').value, row = document.createElement('div');
  row.className = 'row';
  const a = document.createElement('p'); a.textContent = text; row.append(a);
  const entry = {src: text, tr: ''}; log.push(entry);
  if (tgt !== 'none') {
    const b = document.createElement('p'); b.className = 't'; b.textContent = '…'; row.append(b);
    translate(text, tgt).then(r => { b.textContent = entry.tr = r; }).catch(() => { b.textContent = '(terjemahan gagal)'; });
  }
  const atEnd = feedEl.scrollHeight - feedEl.scrollTop - feedEl.clientHeight < 120;
  feedEl.append(row);
  if (atEnd) feedEl.scrollTop = feedEl.scrollHeight;
}

async function translate(q, tgt) {
  const s = $('#src').value, from = s === 'auto' ? 'Autodetect' : s;
  const r = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(q)}&langpair=${from}|${tgt}`);
  const j = await r.json();
  return j.responseData.translatedText;
}

$('#go').onclick = () => running ? stop() : start();
let pipWin = null;
const docs = () => pipWin ? [document, pipWin.document] : [document];

function syncSolo() {
  const solo = $('#tgt').value === 'none';
  docs().forEach(d => d.body.classList.toggle('solo', solo));
}
function syncSize() {
  docs().forEach(d => d.documentElement.style.setProperty('--size', $('#size').value + 'px'));
}
$('#tgt').onchange = syncSolo;
$('#size').oninput = syncSize;
syncSolo();

// Jendela mengambang: kecil = satu caption terakhir, diperbesar = asli + terjemahan berdampingan
async function popOut() {
  if (pipWin) { pipWin.close(); return; }
  if (!('documentPictureInPicture' in window)) {
    return setStatus('Browser ini belum mendukung jendela mengambang. Pakai Chrome atau Edge versi terbaru.');
  }
  pipWin = await documentPictureInPicture.requestWindow({width: 440, height: 170});
  for (const ss of document.styleSheets) {
    try {
      const st = document.createElement('style');
      st.textContent = [...ss.cssRules].map(r => r.cssText).join('\n');
      pipWin.document.head.append(st);
    } catch {
      if (ss.href) {
        const l = document.createElement('link');
        l.rel = 'stylesheet'; l.href = ss.href;
        pipWin.document.head.append(l);
      }
    }
  }
  pipWin.document.body.className = 'pip';
  pipWin.document.body.append(feedEl);
  syncSolo(); syncSize();
  $('#pip').textContent = 'Tutup jendela mengambang';
  setStatus('Jendela mengambang aktif. Tarik sudutnya untuk memperbesar, terjemahan muncul di sebelah kanan.');
  pipWin.addEventListener('pagehide', () => {
    document.body.append(feedEl);
    pipWin = null;
    $('#pip').textContent = 'Jendela mengambang';
    setStatus(running ? 'Mendengarkan…' : 'Siap.');
  });
}
$('#pip').onclick = popOut;
$('#save').onclick = () => {
  const t = log.map(l => l.src + (l.tr ? '\n  → ' + l.tr : '')).join('\n\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([t], {type:'text/plain'}));
  a.download = 'transkrip.txt'; a.click();
};
</script>
</body>
</html>
